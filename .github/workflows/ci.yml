name: Check desktop plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-quota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/codex-quota/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run test:composer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-check-${{ matrix.os }}
          path: |
            plugins/codex-quota/test-results/*.png
            plugins/codex-quota/test-results/result.json
            plugins/codex-quota/test-results/failure.txt
            plugins/codex-quota/test-results/composer/*.png
            plugins/codex-quota/test-results/composer/result.json
            plugins/codex-quota/test-results/composer/failure.txt
