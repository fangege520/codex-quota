name: Build desktop downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/codex-quota
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/codex-quota/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run test:composer
      - run: npm ci
        working-directory: .
      - run: npm run dist -- --win --x64
        working-directory: .
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: Codex-Quota-win-x64
          if-no-files-found: error
          path: |
            plugins/codex-quota/dist/*.zip
            plugins/codex-quota/dist/*.exe
  sign-mac:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: mac-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-quota
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/codex-quota/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run test:composer
      - run: npm ci
        working-directory: .
      - name: Build and sign the macOS disk image
        working-directory: .
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          : "${CSC_LINK:?Configure MAC_CSC_LINK}"
          : "${CSC_KEY_PASSWORD:?Configure MAC_CSC_KEY_PASSWORD}"
          npm run dist -- --mac dmg --${{ matrix.arch }} -c.mac.forceCodeSigning=true -c.mac.notarize=false -c.dmg.sign=true
      - name: Submit the disk image to Apple
        id: notary-submit
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Configure APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Configure APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Configure APPLE_TEAM_ID}"
          image="dist/Codex-Quota-$(node -p 'require("./package.json").version')-mac-${{ matrix.arch }}.dmg"
          codesign --verify --verbose=2 "$image"
          result=$(xcrun notarytool submit "$image" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json)
          submission_id=$(node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).id' <<< "$result")
          [[ "$submission_id" =~ ^[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}$ ]]
          echo "Apple notarization submission ID: $submission_id"
          echo "submission-id=$submission_id" >> "$GITHUB_OUTPUT"
      - name: Wait for Apple notarization and staple the disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.notary-submit.outputs.submission-id }}
        run: |
          image="dist/Codex-Quota-$(node -p 'require("./package.json").version')-mac-${{ matrix.arch }}.dmg"
          result=$(xcrun notarytool wait "$SUBMISSION_ID" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --timeout 4h --output-format json)
          status=$(node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).status' <<< "$result")
          echo "Apple disk image notarization status: $status"
          test "$status" = Accepted
          xcrun stapler staple "$image"
          xcrun stapler validate "$image"
      - name: Verify the app copied from the macOS installer and create the ZIP
        run: |
          image="dist/Codex-Quota-$(node -p 'require("./package.json").version')-mac-${{ matrix.arch }}.dmg"
          hdiutil verify "$image"
          scratch=$(mktemp -d "$RUNNER_TEMP/quota-release.XXXXXX")
          mount="$scratch/volume"
          mkdir "$mount"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          bundle="$scratch/Codex Quota.app"
          ditto "$mount/Codex Quota.app" "$bundle"
          icon=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$bundle/Contents/Info.plist")
          test -n "$icon"
          test -s "$bundle/Contents/Resources/${icon%.icns}.icns"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          spctl --assess --type execute --verbose=2 "$bundle"
          CODEX_QUOTA_SMOKE_EXECUTABLE="$bundle/Contents/MacOS/Codex Quota" npm run smoke
          ditto -c -k --keepParent "$bundle" "${image%.dmg}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: Codex-Quota-mac-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            plugins/codex-quota/dist/*.zip
            plugins/codex-quota/dist/*.dmg
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, sign-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Codex-Quota-*
          merge-multiple: true
          path: downloads
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body: |
            - Windows x64：下载 `win-x64.exe`。
            - macOS：请按 Apple 芯片或 Intel 下载已签名并通过 Apple 公证的 `.dmg`。

            安装后打开 Codex Quota，可在用量助手设置中启动并连接 Codex 左栏。
          files: downloads/*
