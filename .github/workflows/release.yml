name: Build desktop downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-quota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/codex-quota/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm ci
        working-directory: .
      - run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: .
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Quota-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            plugins/codex-quota/dist/*.zip
            plugins/codex-quota/dist/*.dmg
            plugins/codex-quota/dist/*.exe
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Codex-Quota-*
          merge-multiple: true
          path: downloads
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: downloads/*
