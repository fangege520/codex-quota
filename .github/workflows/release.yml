name: Build desktop downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-quota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/codex-quota/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run test:composer
      - run: npm ci
        if: matrix.platform == 'win'
        working-directory: .
      - run: npm run dist -- --win --${{ matrix.arch }}
        if: matrix.platform == 'win'
        working-directory: .
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build and notarize the macOS release
        if: matrix.platform == 'mac'
        id: mac-package
        working-directory: .
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID" ]]; then
            echo '::notice::Apple signing credentials are unavailable. Only the macOS source installation was tested.'
            exit 0
          fi
          : "${CSC_LINK:?Configure MAC_CSC_LINK}"
          : "${CSC_KEY_PASSWORD:?Configure MAC_CSC_KEY_PASSWORD}"
          : "${APPLE_ID:?Configure APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Configure APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Configure APPLE_TEAM_ID}"
          npm ci
          npm run dist -- --mac --${{ matrix.arch }} -c.mac.forceCodeSigning=true -c.mac.notarize=true
          echo 'created=true' >> "$GITHUB_OUTPUT"
      - name: Verify the app copied from the macOS installer
        if: matrix.platform == 'mac' && steps.mac-package.outputs.created == 'true'
        shell: bash
        run: |
          image="dist/Codex-Quota-$(node -p 'require("./package.json").version')-mac-${{ matrix.arch }}.dmg"
          hdiutil verify "$image"
          scratch=$(mktemp -d "$RUNNER_TEMP/quota-release.XXXXXX")
          mount="$scratch/volume"
          mkdir "$mount"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          bundle="$scratch/Codex Quota.app"
          ditto "$mount/Codex Quota.app" "$bundle"
          icon=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$bundle/Contents/Info.plist")
          test -n "$icon"
          test -s "$bundle/Contents/Resources/${icon%.icns}.icns"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          xcrun stapler validate "$bundle"
          spctl --assess --type execute --verbose=2 "$bundle"
          CODEX_QUOTA_SMOKE_EXECUTABLE="$bundle/Contents/MacOS/Codex Quota" npm run smoke
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win' || steps.mac-package.outputs.created == 'true'
        with:
          name: Codex-Quota-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            plugins/codex-quota/dist/*.zip
            plugins/codex-quota/dist/*.dmg
            plugins/codex-quota/dist/*.exe
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Codex-Quota-*
          merge-multiple: true
          path: downloads
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: |
            - Windows x64：下载 `win-x64.exe`。
            - macOS：若附件中有已验证的 `.dmg`，请按 Apple 芯片或 Intel 下载。否则按仓库的 `INSTALL.md` 进行源码安装。

            安装后打开 Codex Quota，可在用量助手设置中启动并连接 Codex 左栏。
          files: downloads/*
